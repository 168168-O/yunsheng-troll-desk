<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>云盛终极推演台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC",system-ui,sans-serif;}
body{background:#0f1420;color:#eef2ff;padding:8px;line-height:1.4;
background-image: radial-gradient(circle at 20% 10%, rgba(80,140,255,0.18), transparent 40%),
radial-gradient(circle at 80% 85%, rgba(210,170,80,0.15), transparent 45%);
min-height:100vh;}
.title-wrap{text-align:center;margin-bottom:10px;}
h1{font-size:23px;color:#d4b878;font-weight:500;letter-spacing:2px;}
.sub-title{font-size:12px;color:#a0aec0;margin-top:3px;}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:10px;margin-bottom:7px;}
.card-title{font-size:15px;color:#d4b878;border-left:3px solid #d4b878;padding-left:7px;margin-bottom:7px;}
textarea, input[type="text"]{width:100%;border:1px solid rgba(255,255,255,0.15);border-radius:9px;padding:8px;background:rgba(255,255,255,0.05);color:#eef2ff;font-size:14px;resize:none;outline:none;}
textarea{min-height:72px;}
textarea::placeholder, input::placeholder{color:#94a3b8;}
.tip-desc{font-size:11px;color:#94a3b8;margin-top:3px;}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,0.08);font-size:14px;}
.info-label{color:#d4b878;}
.upload-box{border:1px dashed rgba(212,184,120,0.25);border-radius:10px;padding:14px;text-align:center;color:#94a3b8;font-size:14px;cursor:pointer;background:rgba(255,255,255,0.04);}
.upload-box img{max-width:100%;border-radius:6px;margin-top:6px;}

/* 冷宝进度条 */
.cold-item{display:flex;align-items:center;margin:5px 0;font-size:14px;}
.cold-name{width:56px;}
.cold-bar{flex:1;height:11px;background:rgba(255,255,255,0.07);border-radius:6px;margin:0 8px;overflow:hidden;}
.cold-fill{height:100%;background:linear-gradient(90deg,#48a878,#76c893);}
.cold-val{width:30px;text-align:right;}

.btn{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(90deg,#48a878,#d4b878);color:#0f1420;font-size:16px;margin:9px 0;font-weight:500;cursor:pointer;}
.btn-small{padding:5px 9px;font-size:12px;width:auto;background:rgba(212,184,120,0.18);color:#d4b878;border-radius:6px;border:1px solid rgba(212,184,120,0.22);cursor:pointer;}
.warn-text{text-align:center;font-size:11px;color:#94a3b8;margin-top:4px;margin-bottom:10px;}

/* 推演得分 */
.result-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.res-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.res-name{font-weight:bold;}
.res-score{color:#d4b878;font-weight:bold;}
.res-bar{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;}
.res-fill{height:100%;background:linear-gradient(90deg,#48a878,#d4b878);}
.tag{font-size:11px;color:#f87171;margin-left:5px;font-weight:normal;}
.tag-hot{color:#fbbf24;}
</style>
</head>
<body>
<div class="title-wrap">
<h1>云盛终极推演台</h1>
<div class="sub-title">图鉴顺延 · 生肖冲合 · 杀大赔小风控</div>
</div>

<div class="card">
<div class="card-title">1. 上一场结果 (必填)</div>
<input type="text" id="lastResult" placeholder="例如：蛇 (输入后引擎才会启动图鉴顺延)">
</div>

<div class="card">
<div class="card-title">2. 本场资料 (粘贴文字)</div>
<textarea id="inputText" placeholder="整段复制粘贴本场信息..."></textarea>
</div>

<div class="card">
<div class="card-title">3. 已识别信息</div>
<div class="info-row"><span class="info-label">属相</span><span id="resZodiac">—</span></div>
<div class="info-row"><span class="info-label">诗句</span><span id="resPoem">—</span></div>
<div class="info-row"><span class="info-label">提示词</span><span id="resTip">—</span></div>
</div>

<div class="card">
<div class="card-title">4. 冷宝统计 · 已保存</div>
<div id="coldWrap"></div>
<button class="btn-small" onclick="editCold()">编辑冷宝数据</button>
</div>

<button class="btn" id="runBtn">开始推演</button>
<div class="warn-text">仅娱乐推演 · 不存在开奖预测能力 · 严禁赌博</div>
<div class="warn-text"><a href="troll.html" style="color:#d4b878;text-decoration:none;">🧌 切换巨魔版 ↗</a></div>

<div class="card" id="resultCard" style="display:none;">
<div class="card-title">推演排名</div>
<div id="resultWrap"></div>
</div>

<script>
// ================= 核心字典库 =================
const tuJianDB = {
    "蛇": { duitou: "马鹿", bichu: ["螺蛳", "金龙", "青蛙", "宝石", "红燕", "鸽子", "蝴蝶", "乌龟", "蚯蚓", "老虎", "兔子", "牛", "飞龙", "马", "大象", "野猫"] },
    "白鱼": { duitou: "飞龙", bichu: ["红燕", "乌鸦", "乌龟", "鸡", "兔子", "羊", "马", "蛇", "蜘蛛", "螃蟹", "飞龙", "家猫", "仙鹤", "尼姑"] },
    "金鱼": { duitou: "宝石", bichu: ["青蛙", "蚯蚓", "兔子", "蜘蛛", "飞龙", "蜜蜂", "大象"] },
    "螃蟹": { duitou: "大象", bichu: ["白鱼", "螺蛳", "宝石", "蝴蝶", "鸽子", "金龙", "乌龟", "黄鳝", "鸡", "蚯蚓", "猪", "老虎", "狗", "马", "老鼠", "大象", "家猫", "尼姑"] },
    "蚯蚓": { duitou: "黄蜂", bichu: ["黄鳝", "牛", "兔子", "羊", "飞龙", "马鹿", "蜘蛛", "螃蟹", "蛇", "乌龟", "金鱼", "鸡", "老虎"] },
    "猪": { duitou: "猴子", bichu: ["孔雀", "大鹅", "螺蛳", "白鱼", "牛", "老虎", "兔子", "蚯蚓", "宝石", "鸡", "金鱼", "羊", "蜘蛛", "飞龙", "马鹿"] },
    "白马": { duitou: "青蛙", bichu: ["老虎", "乌鸦", "乌龟", "牛", "猪", "兔子", "蚯蚓", "螃蟹", "大象", "飞龙", "老鼠", "蜜蜂"] }
};

const zodiacRules = {
    "狗": { he: ["兔"], sanhe: ["虎", "马"], chong: ["龙"] },
    "鸡": { he: ["龙"], sanhe: ["蛇", "牛"], chong: ["兔"] },
    "牛": { he: ["鼠"], sanhe: ["蛇", "鸡"], chong: ["羊"] },
    "猴": { he: ["蛇"], sanhe: ["鼠", "龙"], chong: ["虎"] },
    "鼠": { he: ["牛"], sanhe: ["猴", "龙"], chong: ["马"] },
    "猪": { he: ["虎"], sanhe: ["兔", "羊"], chong: ["蛇"] }
};

let coldList = JSON.parse(localStorage.getItem("coldData")) || [
    {name:"兔子",miss:81},{name:"大象",miss:20},{name:"野猫",miss:19},{name:"狗",miss:19},{name:"孔雀",miss:18}
];

// 渲染进度条
function renderCold(){
    let html="";
    // 按遗漏值排序显示
    let sorted = [...coldList].sort((a,b)=>b.miss - a.miss).slice(0, 10);
    let maxMiss = Math.max(1, ...sorted.map(i=>i.miss));
    sorted.forEach(i=>{
        let pct = Math.min(i.miss / maxMiss * 100, 100);
        html += `<div class="cold-item"><div class="cold-name">${i.name}</div><div class="cold-bar"><div class="cold-fill" style="width:${pct}%"></div></div><div class="cold-val">${i.miss}</div></div>`;
    });
    document.getElementById("coldWrap").innerHTML = html;
}
function saveCold(){ localStorage.setItem("coldData", JSON.stringify(coldList)); }
function editCold(){
    let str = prompt("按格式录入：兔子:81,大象:20,野猫:19","");
    if(!str) return;
    let arr = str.split(/[,，]/);
    let tmp = [];
    arr.forEach(s=>{
        let p = s.split(/[:：]/);
        if(p.length < 2) return;
        let n = p[0].trim();
        let v = Number(p[1].trim());
        if(n && !isNaN(v)) tmp.push({name:n, miss:v});
    });
    if(tmp.length === 0){ alert("格式不对，示例：兔子:81,大象:20"); return; }
    coldList = tmp; saveCold(); renderCold();
}

// 自动识别文本
document.getElementById("inputText").oninput = function(){
    let txt = this.value;
    const Z = "(鼠|牛|虎|兔|龙|蛇|马|羊|猴|鸡|狗|猪)";
    let zMatch = txt.match(new RegExp("(?:属相|生肖|本肖|生肖属|本期属)\\s*[:：]?\\s*[\\[\\(【]?\\s*" + Z))
              || txt.match(new RegExp("属" + Z));
    if(!zMatch) zMatch = txt.match(new RegExp(Z));
    let pMatch = txt.match(/题目[:：]?\s*([\s\S]*?)(?=宝岗|译文|提示|数字|$)/);
    let tips = [];
    txt.split('\n').forEach(line => {
        if(line.includes("提示")) {
            let clean = line.replace(/.*?提示[:：]?\s*/, '').replace(/[☘️🌴🍀♥️]/g, '').trim();
            if(clean && clean.length > 1) tips.push(clean);
        }
    });
    document.getElementById("resZodiac").innerText = zMatch ? zMatch[1] : "—";
    document.getElementById("resPoem").innerText = pMatch ? pMatch[1].replace(/[\n\r（(].*?[)）]/g, '').trim() : "—";
    document.getElementById("resTip").innerText = tips.length > 0 ? tips.join(" / ") : "—";
};

// 核心推演算法（出结果界面）
document.getElementById("runBtn").onclick = () => {
    let lastGame = document.getElementById("lastResult").value.trim();
    let zodiac = document.getElementById("resZodiac").innerText;
    let poem = document.getElementById("resPoem").innerText;
    let tipText = document.getElementById("resTip").innerText;

    if(lastGame === "") {
        alert("请先输入上一场开奖结果！这是图鉴顺延的基础。");
        return;
    }

    let resWrap = document.getElementById("resultWrap");
    let resCard = document.getElementById("resultCard");
    resCard.style.display = "block";

    let animals = ["兔子","马鹿","马","白马","螃蟹","大象","野猫","家猫","狗","孔雀","蝴蝶","牛","乌鸦","尼姑","蜘蛛","宝石","乌龟","飞龙","金龙","老鼠","鸽子","猪","大鹅","蚯蚓","鸡","蛇","白鱼","金鱼","羊","仙鹤","老虎","燕子","螺丝","螺蛳","鳝鱼","黄鳝","猴子","青蛙","蜜蜂","黄蜂","红燕"];
    let scores = {};
    animals.forEach(a => scores[a] = 50);

    // 1. 图鉴顺延加分
    if (tuJianDB[lastGame]) {
        let db = tuJianDB[lastGame];
        if(scores[db.duitou] !== undefined) scores[db.duitou] += 30;
        db.bichu.forEach(animal => {
            if(scores[animal] !== undefined) scores[animal] += 20;
        });
    }

    // 2. 生肖暗线加分
    if (zodiacRules[zodiac]) {
        let rules = zodiacRules[zodiac];
        rules.he.forEach(a => { if(scores[a]!==undefined) scores[a] += 15; });
        rules.sanhe.forEach(a => { if(scores[a]!==undefined) scores[a] += 10; });
        rules.chong.forEach(a => { if(scores[a]!==undefined) scores[a] += 15; });
    }

    // 3. NLP文本匹配 (辅助加分)
    let allText = poem + tipText;
    if (allText.includes("花") || allText.includes("草")) { scores["蝴蝶"] += 10; scores["家猫"] += 10; }
    if (allText.includes("猫") || allText.includes("鼠")) { scores["家猫"] += 15; scores["老鼠"] += 15; }
    if (allText.includes("龙") || allText.includes("飞")) { scores["飞龙"] += 10; scores["金龙"] += 10; }
    if (allText.includes("马")) { scores["马"] += 10; scores["马鹿"] += 10; }

    // 4. IsolationForest 杀大赔小风控
    coldList.forEach(item => {
        if (scores[item.name] !== undefined) {
            if (item.miss > 50) scores[item.name] -= 60;      // 极冷诱饵扣分
            else if (item.miss > 20) scores[item.name] -= 20; // 中度冷门扣分
            else if (item.miss <= 2) scores[item.name] -= 10; // 刚出防连扣分
        }
    });

    // 5. 排序并生成漂亮 UI
    let sortedArr = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    let html = "";

    for (let i = 0; i < 10; i++) {
        let name = sortedArr[i][0];
        let score = sortedArr[i][1];
        // 这里限制最高分为100，为了让进度条好看
        let displayScore = Math.min(Math.max(score, 0), 100);

        let hit = coldList.find(c => c.name === name);
        let miss = hit ? hit.miss : undefined;
        let missText = miss !== undefined ? `<span style="font-size:12px;color:#94a3b8;">遗漏${miss}</span>` : "";

        let tag = "";
        if (miss !== undefined && miss > 50) tag = `<span class="tag">极冷陷阱</span>`;
        else if (tuJianDB[lastGame] && name === tuJianDB[lastGame].duitou) tag = `<span class="tag tag-hot">对头绝杀</span>`;

        html += `
        <div class="result-item">
            <div class="res-head">
                <span class="res-name">${i+1}. ${name}${missText} ${tag}</span>
                <span class="res-score">得分 ${score}</span>
            </div>
            <div class="res-bar">
                <div class="res-fill" style="width:${displayScore}%"></div>
            </div>
        </div>`;
    }
    resWrap.innerHTML = html;
};
renderCold();
</script>
</body>
</html>
